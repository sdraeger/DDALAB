[package]
name = "ddalab-py"
version = "2.5.1"
edition = "2021"
authors = ["DDALAB Contributors"]
description = "The ddalab Python wheel: the dda-rs engine for NumPy and the ddalab command line"
license = "MIT"
repository = "https://github.com/sdraeger/DDALAB"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
# CUDA builds are Linux builds (see dda-rs).
cuda = ["dda-rs/cuda"]

[dependencies]
dda-rs = { path = "../dda-rs" }
clap = "4"
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
