[package]
name = "ddalab-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The ddalab Python wheel: the dda-rs engine for NumPy and the ddalab command line"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
# CUDA builds are Linux builds (see dda-rs); gpu uses wgpu (Vulkan, Metal, DX12) on every platform.
cuda = ["dda-rs/cuda"]
gpu = ["dda-rs/gpu"]

[dependencies]
dda-rs = { path = "../dda-rs" }
clap = "4"
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde_json = "1"

[package.metadata.dist]
dist = false
