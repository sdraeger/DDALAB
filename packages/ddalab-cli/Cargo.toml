[package]
name = "ddalab"
version = "2.7.2"
edition = "2021"
authors = ["DDALAB Contributors"]
description = "Delay differential analysis of neurophysiological recordings: the ddalab command-line tool"
license = "MIT"
repository = "https://github.com/sdraeger/DDALAB"
homepage = "https://ddalab.org/"
readme = "README.md"
publish = false

[[bin]]
name = "ddalab"
path = "src/main.rs"

[features]
cuda = ["dda-rs/cuda"]
gpu = ["dda-rs/gpu"]

[dependencies]
dda-rs = { path = "../dda-rs" }

# cargo-dist builds every target with `cuda` (Linux only; it compiles to nothing elsewhere) and `gpu` (any graphics
# card through Vulkan, Metal or DX12).
[package.metadata.dist]
dist = true
features = ["cuda", "gpu"]

[profile.dist]
inherits = "release"
