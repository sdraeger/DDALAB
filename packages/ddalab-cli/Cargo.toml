[package]
name = "ddalab"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Delay differential analysis of neurophysiological recordings: the ddalab command-line tool"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false

[[bin]]
name = "ddalab"
path = "src/main.rs"

[features]
cuda = ["dda-rs/cuda"]
gpu = ["dda-rs/gpu"]

[dependencies]
dda-rs = { path = "../dda-rs" }

# cargo-dist builds every target with `cuda` (Linux only; it compiles to nothing elsewhere) and `gpu` (any graphics
# card through Vulkan, Metal or DX12).
[package.metadata.dist]
dist = true
features = ["cuda", "gpu"]
