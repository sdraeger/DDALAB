[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddalab"
version = "1.2.11"
description = "DDALAB desktop application and command-line interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6==6.8.2.1",
  "requests>=2.32.0,<3",
  "urllib3<2",
  "numpy==1.26.4",
  "matplotlib==3.10.8",
  "scipy==1.13.1",
  "scikit-learn==1.5.2",
  "mne==1.8.0",
  "defusedxml>=0.7,<1",
  "pymatreader>=0.0.32,<1",
  "mffpy>=0.10,<1",
  "nibabel==5.3.3",
  "pyxdf==1.16.8",
  "pynwb==2.8.3",
  "packaging>=24,<25",
]

[project.urls]
Homepage = "https://github.com/sdraeger/DDALAB"
Documentation = "https://github.com/sdraeger/DDALAB/tree/main/packages/ddalab"
Repository = "https://github.com/sdraeger/DDALAB"
Issues = "https://github.com/sdraeger/DDALAB/issues"

[project.scripts]
ddalab = "ddalab_app.__main__:main"
ddalab-cli = "ddalab_app.__main__:main"
ddalab-gui = "ddalab_app.gui_main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ddalab_app*"]

[tool.setuptools.package-data]
ddalab_app = [
  "assets/*.svg",
  "assets/icons/*",
  "assets/fonts/*.ttf",
  "ui/qml/*.qml",
  "ui/qml/workbench/*.qml",
  "ui/qml/workbench/components/*.qml",
  "ui/qml/workbench/pages/*.qml",
  "runtime/bin/*",
]
