[package]
name = "dda-rs"
version = "2.5.1"
edition = "2021"
authors = ["DDALAB Contributors"]
description = "Pure Rust Delay Differential Analysis engine"
license = "MIT"
repository = "https://github.com/sdraeger/DDALAB"
homepage = "https://ddalab.org/"
documentation = "https://docs.rs/dda-rs"
keywords = ["dda", "delay-differential", "analysis", "eeg", "time-series"]
categories = ["science", "api-bindings"]
readme = "README.md"
include = [
	"Cargo.toml",
	"README.md",
	"LICENSE",
	"src/**/*.rs",
	"src/bin/**/*.rs",
	"tests/**/*.rs",
	"tests/fixtures/**",
]

[features]
default = []
cuda = ["dep:cudarc"]

[[bin]]
name = "ddalab"
path = "src/bin/ddalab/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2.0.17"
dirs = "6.0.0"
memmap2 = "0.9.9"
nalgebra = { version = "0.33", default-features = false, features = ["std", "libm-force"] }
rayon = "1.11"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
libm = "0.2"
sha2 = "0.10"
miniz_oxide = "0.8"

# Native only: wasm32-unknown-unknown has no clock, OS randomness, threads or cudarc build; the host stamps id and created_at.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env", "color"] }
env_logger = "0.11"
glob = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# CUDA builds are Linux builds: elsewhere the `cuda` feature compiles nothing, so one feature list serves every target.
[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "cublas", "dynamic-loading", "cuda-11040"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
