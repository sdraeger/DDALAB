[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ddalab"
dynamic = ["version"]
description = "Delay differential analysis of neurophysiological recordings: the ddalab command-line tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
keywords = ["dda", "delay-differential", "eeg", "time-series"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://snl.salk.edu/~sfdraeger/ddalab"
Repository = "https://github.com/sdraeger/DDALAB"
Issues = "https://github.com/sdraeger/DDALAB/issues"

[tool.maturin]
# The wheel carries the `ddalab` executable only; the version comes from Cargo.toml.
bindings = "bin"
strip = true
