[package]
name = "ddalab-wasm"
version = "2.5.1"
edition = "2021"
description = "The dda-rs WebAssembly ABI that DDALAB's browser workers load"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dda-rs = { path = "../dda-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
