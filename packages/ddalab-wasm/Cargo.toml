[package]
name = "ddalab-wasm"
version.workspace = true
edition.workspace = true
description = "The dda-rs WebAssembly ABI that DDALAB's browser workers load"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dda-rs = { path = "../dda-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.dist]
dist = false
