[workspace]
members = ["cargo:packages/ddalab-cli"]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
installers = ["shell", "powershell", "homebrew"]
tap = "sdraeger/homebrew-tap"
install-path = "CARGO_HOME"
github-attestations = true
# Attested when the release is hosted, so the installers, the formula and the checksums are attested with the archives.
github-attestations-phase = "host"
github-attestations-filters = ["*.tar.xz", "*.zip", "*.sh", "*.ps1", "*.rb", "*.sum", "*.tar.gz"]
pr-run-mode = "plan"
github-build-setup = "../build-setup.yml"

# dist puts Apple Silicon on macos-14, which GitHub retires on 2026-11-02.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# Actions run with the release token, so they are pinned to commits.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
