[workspace]
members = ["cargo:packages/ddalab-cli"]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
installers = ["shell", "powershell", "homebrew"]
tap = "sdraeger/homebrew-tap"
install-path = "CARGO_HOME"
github-attestations = true
# Attested when the release is hosted, so the installers, the formula and the checksums are attested with the archives.
github-attestations-phase = "host"
github-attestations-filters = ["*.tar.xz", "*.zip", "*.sh", "*.ps1", "*.rb", "*.sum", "*.tar.gz"]
pr-run-mode = "plan"
github-build-setup = "../build-setup.yml"
