name: DDALAB Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            ./packages/dda-rs -> target
            ./packages/ddalab-cli -> target

      # Release profile: blocks_equal_single_run alone takes 17 minutes unoptimized.
      - name: Run dda-rs tests
        run: |
          cargo test --release --locked --manifest-path packages/dda-rs/Cargo.toml
          cargo test --release --locked --features cuda,gpu --manifest-path packages/dda-rs/Cargo.toml
          cargo test --release --locked --features cuda,gpu --manifest-path packages/ddalab-cli/Cargo.toml

  python:
    name: Python library
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./packages/ddalab-py -> target"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The wheel holds the engine and the command line; its tests compare the library with the command's documents.
      - name: Build, install and test the package
        run: |
          python -m pip install maturin numpy pytest
          maturin build --release --locked --manifest-path packages/ddalab-py/Cargo.toml --out "$RUNNER_TEMP/wheels"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/wheels" ddalab
          python -m pytest -q packages/ddalab-py/tests
