name: DDALAB Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/dda-rs -> target"

      - name: Run dda-rs tests
        run: |
          cargo test --locked --manifest-path packages/dda-rs/Cargo.toml
          cargo test --locked --features cuda --manifest-path packages/dda-rs/Cargo.toml

  python:
    name: Python ${{ matrix.python }} and GUI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-22.04
            python: "3.12"
          - os: windows-2022
            python: "3.12"
          - os: macos-14
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            patchelf

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/dda-rs -> target"

      - name: Stage bundled runtime backend
        working-directory: packages/ddalab
        run: python scripts/prepare_runtime.py --clean --print-dir

      - name: Install DDALAB
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/ddalab

      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest discover -s packages/ddalab/tests

      - name: Verify CLI
        run: |
          ddalab --help
          ddalab health --json

      - name: Smoke test GUI
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ddalab-gui --smoke-test

  lint:
    name: Python lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.11.2

      - name: Check Python formatting
        run: ruff format --check packages/ddalab/ddalab_app packages/ddalab/tests packages/ddalab/scripts packages/ddalab/run_ddalab.py

      - name: Lint Python
        run: ruff check packages/ddalab/ddalab_app packages/ddalab/tests packages/ddalab/scripts packages/ddalab/run_ddalab.py
