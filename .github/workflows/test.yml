name: DDALAB Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/dda-rs -> target"

      # Release profile: blocks_equal_single_run alone takes 17 minutes unoptimized.
      - name: Run dda-rs tests
        run: |
          cargo test --release --locked --manifest-path packages/dda-rs/Cargo.toml
          cargo test --release --locked --features cuda --manifest-path packages/dda-rs/Cargo.toml
