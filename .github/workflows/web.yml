name: DDALAB Web

on:
  pull_request:
    paths:
      - "packages/ddalab-web/**"
      - "packages/ddalab-wasm/**"
      - "packages/dda-rs/**"
      - ".github/workflows/web.yml"
  push:
    branches: ["main"]
    tags: ["v*"]
    # GitHub does not evaluate path filters for pushes of tags.
    paths:
      - "packages/ddalab-web/**"
      - "packages/ddalab-wasm/**"
      - "packages/dda-rs/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web app (lint, unit tests, build, self-hosting smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/ddalab-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag deploys the site: it must equal the packages' version.
      - name: Check the versions against the tag
        working-directory: .
        run: scripts/check-versions.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        # A tag publishes this build: it restores no cache another run could have written.
        if: github.ref_type != 'tag'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            packages/dda-rs -> target
            packages/ddalab-wasm -> target

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          package-manager-cache: ${{ github.ref_type != 'tag' }}
          cache-dependency-path: packages/ddalab-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the wasm core
        run: npm run build:wasm

      - name: Biome
        run: npm run check

      # Unit tests compare exports with the native CLI and fail under CI when it is missing.
      - name: Build the native CLI
        working-directory: packages/dda-rs
        run: cargo build --release --locked

      - name: Unit tests
        run: npx vitest run

      # The self-hosting smoke test runs the three browsers; the e2e tests have jobs of their own (below).
      # The system packages of --with-deps have stalled on the Ubuntu mirror: see scripts/install-browsers.sh.
      - name: Install browsers
        run: scripts/install-browsers.sh chromium firefox webkit

      # Type check, vite build, then the dist check (no test hooks) and the bundle size check.
      - name: Production build
        run: npm run build

      - name: Self-hosting smoke test
        run: npm run test:dist

      - name: Self-hosting smoke test with the wasm served without its MIME type
        run: npm run test:dist
        env:
          DIST_WASM_TYPE: application/octet-stream

      # What the pages job deploys: this dist, after its tests. The artifact leaves out hidden files, which are the
      # .htaccess (the build copied its policy into index.html as a meta element).
      - name: Keep the site for GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/ddalab-web/dist

      - name: Zip the bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd dist && zip -qr "../ddalab-web-${GITHUB_REF_NAME#v}.zip" .)
          unzip -l "ddalab-web-${GITHUB_REF_NAME#v}.zip"

      - name: Keep the bundle for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-bundle
          path: packages/ddalab-web/ddalab-web-*.zip
          if-no-files-found: error

  # One job per browser: three browsers in one job ran past the time limit. Each builds its own wasm core and native CLI
  # (the tests compare the browser's results with the CLI's bundles) and does not wait for the web job.
  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: packages/ddalab-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            packages/dda-rs -> target
            packages/ddalab-wasm -> target

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: packages/ddalab-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the wasm core
        run: npm run build:wasm

      - name: Build the native CLI
        working-directory: packages/dda-rs
        run: cargo build --release --locked

      - name: Install the browser
        run: scripts/install-browsers.sh ${{ matrix.browser }}

      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.browser }}

      # playwright.config.ts writes the HTML report and keeps the traces of failed tests under CI.
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            packages/ddalab-web/playwright-report
            packages/ddalab-web/test-results
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Attach the bundle to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-bundle

      # `gh attestation verify ddalab-web-<version>.zip --repo sdraeger/DDALAB` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ddalab-web-*.zip

      # release.yml (cargo-dist) creates the release once its builds pass, which can take longer than this workflow.
      - name: Attach the bundle
        run: |
          for _ in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" ddalab-web-*.zip --clobber

  # The same tested bundle as an image, ghcr.io/sdraeger/ddalab-web:<version> (and :latest when the tag has no "-"),
  # served by Caddy from packaging/web. The image has no RUN step, so it builds for both platforms without emulation.
  image:
    name: Web app image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-bundle

      - name: Unpack the bundle and name the tags
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          unzip -q "ddalab-web-$version.zip" -d packaging/web/dist
          tags="ghcr.io/sdraeger/ddalab-web:$version"
          if [[ "$version" != *-* ]]; then tags="$tags,ghcr.io/sdraeger/ddalab-web:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/web
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: ddalab-web:test

      - name: Test the image
        run: |
          docker run -d --rm --name web -p 8080:8080 ddalab-web:test
          for _ in $(seq 20); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          header() { curl -sfI "http://localhost:8080$1" | tr -d '\r' | grep -i "^$2:" ; }
          wasm="$(cd packaging/web/dist && find ./assets -name "*.wasm" | head -1 | cut -c2-)"
          header / cache-control | grep -q no-cache
          header /sw.js cache-control | grep -q no-cache
          header "$wasm" content-type | grep -q application/wasm
          header "$wasm" cache-control | grep -q immutable
          curl -sf http://localhost:8080/ | grep -q 'http-equiv="Content-Security-Policy"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.htaccess)" = 404
          docker stop web

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/web
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

      # `gh attestation verify oci://ghcr.io/sdraeger/ddalab-web:<version> --repo sdraeger/DDALAB` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sdraeger/ddalab-web
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publishes the dist the web job built and tested at https://ddalab.org/, the repository's Pages custom domain (the base path is relative).
  # The github-pages environment must allow deployments from v* tags. A tag with a "-" is a pre-release and stays off
  # the site: every installed copy would offer it as an update. It waits for the build alone: the tagged commit passed the
  # end-to-end tests on main, and a flaky rerun here must not hold the release off the site.
  pages:
    name: Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
