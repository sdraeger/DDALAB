name: npm

# A v* tag builds the ddalab-wasm package, tests it, attests the tarball and attaches it to the release. It publishes to
# npm (with provenance, through trusted publishing) only when the repository variable NPM_PUBLISH is "true": the first
# version is published by hand from the attached tarball, then the trusted publisher and the variable are set.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ddalab-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Compiled into every result document as reproduction.git_commit.
      DDALAB_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the versions against the tag
        id: version
        run: echo "version=$(scripts/check-versions.sh)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # A publishing build restores no cache another run could have written.
          package-manager-cache: false

      - name: Build and test the package
        working-directory: packages/ddalab-wasm
        run: |
          cargo build --release --locked --target wasm32-unknown-unknown
          npm test
          npm pack

      # `gh attestation verify ddalab-wasm-<version>.tgz --repo sdraeger/DDALAB` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/ddalab-wasm/ddalab-wasm-*.tgz

      # release.yml (cargo-dist) creates the release once its builds pass.
      - name: Attach the tarball to the release
        if: github.ref_type == 'tag'
        run: |
          for _ in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" packages/ddalab-wasm/ddalab-wasm-*.tgz --clobber

      - name: Publish to npm
        if: github.ref_type == 'tag' && vars.NPM_PUBLISH == 'true'
        working-directory: packages/ddalab-wasm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Trusted publishing needs npm 11.5 or later; a fixed version, since @latest is whatever npm serves on release day.
          npm install -g npm@11.21.2
          tag=latest
          if [[ "$VERSION" == *-* ]]; then tag=next; fi
          npm publish ddalab-wasm-*.tgz --provenance --access public --tag "$tag"
