name: Container

# Builds the BIDS App image and tests it on a two-subject dataset. A v* tag also pushes it to
# ghcr.io/sdraeger/ddalab:<version> (and :latest when the tag has no "-") with build provenance.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/container/**"
      - "packages/dda-rs/**"
      - "packages/ddalab-cli/**"
      - ".dockerignore"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: BIDS App image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the versions against the tag
        id: version
        run: |
          version="$(scripts/check-versions.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags="ghcr.io/sdraeger/ddalab:$version"
          if [[ "$version" != *-* ]]; then tags="$tags,ghcr.io/sdraeger/ddalab:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/container/Dockerfile
          build-args: |
            DDALAB_GIT_COMMIT=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: ddalab:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the BIDS App
        run: |
          export TEST_DIR="$RUNNER_TEMP/bids-test"
          mkdir -p "$TEST_DIR"
          packaging/container/test-run.sh docker run --rm -v "$TEST_DIR:$TEST_DIR" ddalab:test

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.ref_type == 'tag'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/container/Dockerfile
          build-args: |
            DDALAB_GIT_COMMIT=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha

      # `gh attestation verify oci://ghcr.io/sdraeger/ddalab:<version> --repo sdraeger/DDALAB` checks it.
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-name: ghcr.io/sdraeger/ddalab
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
